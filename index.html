<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bound Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: drei Spalten (Elemente | Bearbeiten | Vorschau), unter 1100px als Tabs. Akzent = Postenkreis der Orientierungslauf-Karte. */
:root{
  --bg:#f1f4f3; --panel:#ffffff; --panel2:#e8eeed; --ink:#14232b; --muted:#566872; --line:#d3dedf;
  --accent:#b02468; --accent-ink:#ffffff; --accent-soft:#f6dfeb;
  --ok:#1b7857; --ok-soft:#d8efe5; --warn:#9a6208; --warn-soft:#f7ebd2; --bad:#b83232; --bad-soft:#f7dcdc; --info-soft:#e0ecf3;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --font-b:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --font-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --panel:#172126; --panel2:#1f2c32; --ink:#e6eef1; --muted:#95a7b0; --line:#2b3a41;
  --accent:#e2679f; --accent-ink:#1b0a13; --accent-soft:#3a1a2b;
  --ok:#4cc39a; --ok-soft:#133428; --warn:#e0a94a; --warn-soft:#38290e; --bad:#ef7c7c; --bad-soft:#401b1b; --info-soft:#1b2d38; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f171b; --panel:#172126; --panel2:#1f2c32; --ink:#e6eef1; --muted:#95a7b0; --line:#2b3a41;
  --accent:#e2679f; --accent-ink:#1b0a13; --accent-soft:#3a1a2b;
  --ok:#4cc39a; --ok-soft:#133428; --warn:#e0a94a; --warn-soft:#38290e; --bad:#ef7c7c; --bad-soft:#401b1b; --info-soft:#1b2d38; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-b);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.tight{gap:4px}.row.end{justify-content:flex-end}
.linklike{background:none;border:0;padding:0;color:var(--accent);text-align:left;cursor:pointer;text-decoration:underline}

/* App-Gerüst */
.app{display:grid;grid-template-columns:290px minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 18px var(--font-d)}
.brand svg{width:26px;height:26px;color:var(--accent)}
#bound-title{flex:1 1 220px;min-width:160px;max-width:420px;font:600 16px var(--font-d);padding:6px 10px;border:1px solid transparent;border-radius:8px;background:var(--panel2)}
#bound-title:hover{border-color:var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.mtabs{display:none}
.side,.work,.prev{min-height:0;overflow:auto}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-h{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px 6px;font:700 13px var(--font-d);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#meta-item{margin:8px 10px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;text-align:left;font-weight:600}
#meta-item.sel{border-color:var(--accent);background:var(--accent-soft)}
.ls{list-style:none;margin:0;padding:4px 10px;flex:1;overflow:auto}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:3px 0;border:1px solid transparent;border-radius:8px;cursor:pointer}
.li:hover{background:var(--panel2)}
.li.sel{border-color:var(--accent);background:var(--accent-soft)}
.li.drag{opacity:.4}.li.over{border-top:2px solid var(--accent)}
.li-ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--font-d);background:var(--panel2);border:1.5px solid var(--muted);color:var(--ink)}
.t-quiz,.t-mission,.t-code,.t-location,.t-survey{border-color:var(--accent);color:var(--accent)}
.t-choice,.t-jump,.t-action,.t-timer,.t-end{border-style:dashed}
.li-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.li-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-txt small{color:var(--muted);font-size:12px}
.li-flag,.li-warn{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--font-d)}
.li-flag{background:var(--info-soft);color:var(--ink)}
.li-warn{background:var(--warn);color:#fff}
.side-f{padding:10px;border-top:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:8px}
#prob{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;font-size:13px}
#prob summary{cursor:pointer;font-weight:600}
#prob ul{margin:6px 0 0;padding-left:16px}
.addmenu{position:absolute;left:10px;right:10px;bottom:56px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px #0003;padding:8px;z-index:20}
.cat-t{font:700 12px var(--font-d);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 6px 2px}
.addit{display:flex;gap:10px;align-items:center;width:100%;padding:6px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
.addit:hover{background:var(--panel2)}
.addit span:last-child{display:flex;flex-direction:column}.addit small{color:var(--muted);font-size:12px}

/* Mitte */
.work{padding:0 0 60px}
#form{max-width:760px;padding:18px 20px;margin:0 auto}
.fhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.kind{display:inline-block;padding:3px 10px;border:1.5px solid var(--accent);border-radius:99px;font:700 13px var(--font-d);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
.lbl,.sublbl{font-size:13px;font-weight:600;color:var(--muted)}
.sublbl{display:flex;flex-direction:column;gap:4px}
.hint{color:var(--muted);font-size:12.5px}
.note{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--info-soft);font-size:14px}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
textarea{resize:vertical;min-height:60px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.frow .field{margin:0 0 14px}
.chk-row{display:flex;gap:8px;align-items:center;margin:0 0 12px;cursor:pointer}
.chk-row input{width:18px;height:18px;accent-color:var(--accent)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.item-fields{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px;align-items:end}
.item-fields .field{margin:0}.item-fields .field.list,.item-fields .chk-row{margin:0}
.item-fields .field.list{grid-column:1/-1}
.item-tools{display:flex;flex-direction:column;gap:3px}
.item-tools button{width:28px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;line-height:1}
.item-tools button:disabled{opacity:.35}.item-tools .del{color:var(--bad)}
.empty{margin:0;color:var(--muted);font-size:13px}
.logic{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--panel)}
.logic summary{cursor:pointer;padding:12px 0;font:700 14px var(--font-d)}
.logic[open] summary{border-bottom:1px solid var(--line);margin-bottom:14px}
.media{display:flex;flex-direction:column;gap:8px}.media img{max-width:220px;max-height:140px;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.geo-map{height:240px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}

/* Vorschau */
.prev{background:var(--panel2);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 14px 16px;gap:10px}
.prev-h{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;max-width:368px}
.prev-h h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.phone{width:100%;max-width:368px;flex:1;min-height:520px;max-height:760px;border:9px solid #0e171c;border-radius:34px;background:var(--bg);overflow:hidden;display:flex;box-shadow:0 14px 40px #0003}
#phone-in{flex:1;min-width:0}

/* Karte */
.smap{position:relative;overflow:hidden;background:var(--panel2) repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,var(--line) 31px 32px);touch-action:none;cursor:grab;user-select:none}
.smap-tiles,.smap-over{position:absolute;inset:0}
.smap-tile{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;pointer-events:none}
.smap-over{pointer-events:none}
.smap-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.smap-zoom button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.smap-attr{position:absolute;right:0;bottom:0;padding:1px 6px;font-size:11px;background:#ffffffcc;color:#333}
.smap-attr a{color:#0645ad}
.smap-note{position:absolute;left:8px;top:8px;right:48px;padding:5px 8px;border-radius:6px;background:var(--panel);font-size:12px;color:var(--muted);border:1px solid var(--line)}

/* Player */
.pl{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg);color:var(--ink)}
.pl-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.pl-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 14px var(--font-d)}
.pl-pills{display:flex;gap:6px}
.pl-score,.pl-clock{padding:2px 9px;border-radius:99px;background:var(--panel2);font-size:13px;font-variant-numeric:tabular-nums}
.pl-score{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pl-endbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.pl-prog{height:4px;background:var(--panel2)}.pl-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pl-body{flex:1;min-height:0;overflow:auto;padding:14px}
.pl-card{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pl-kind{font:700 12px var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pl-card h1{font-size:26px}.pl-card h2{font-size:22px}
.pl-md p{margin:0 0 8px}.pl-md ul{margin:0 0 8px;padding-left:20px}.pl-md h4{margin:8px 0 4px}.pl-md img,.pl-img,.pl-cover{max-width:100%;border-radius:10px}.pl-md a{color:var(--accent)}
.pl-video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}.pl-audio{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--panel2);font-size:13px}
.chip.pts{background:var(--ok);color:#fff;font-weight:600}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.bad{border-color:var(--bad)!important}
.big{font-size:18px;padding:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--muted)}
.opt .mk{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%}
.opt.chk .mk{border-radius:5px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .mk{background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.go{justify-content:center;font-weight:600}
.opt.go .mk{display:none}
.pl-fb{padding:12px 14px;border-radius:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pl-fb p{margin:0 0 6px}
.pl-fb.ok{background:var(--ok-soft)}.pl-fb.bad{background:var(--bad-soft)}.pl-fb.info{background:var(--info-soft)}
.sort{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sort li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel)}
.sort li.right{border-color:var(--ok);background:var(--ok-soft)}.sort li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mv{display:flex;gap:4px}.mv button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer}.mv button:disabled{opacity:.3}
.match{display:flex;flex-direction:column;gap:10px}
.match label{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;align-items:center;padding:8px;border:2px solid transparent;border-radius:10px}
.match label.right{border-color:var(--ok);background:var(--ok-soft)}.match label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qtimer{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.qtimer i{display:block;height:100%;width:100%;background:var(--warn)}
.stars{display:flex;gap:4px}.star{font-size:34px;line-height:1;border:0;background:none;color:var(--line);cursor:pointer}.star.on{color:#e8a317}
.mprev img,.mprev video{max-width:100%;border-radius:10px}
.scan video{width:100%;border-radius:10px;background:#000}
.compass{width:150px;height:150px;margin:0 auto}
.compass .ring{fill:var(--panel);stroke:var(--line);stroke-width:2}.compass .n{fill:var(--muted);font:700 11px var(--font-d)}
.compass .arw{fill:var(--accent);transition:transform .3s}
.loc-status{text-align:center;color:var(--muted);font-size:14px}
.pl-map{height:200px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.bigtime{font:700 56px var(--font-d);text-align:center;font-variant-numeric:tabular-nums}
.bigscore{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.bigscore b{font:700 56px/1 var(--font-d);color:var(--accent)}
.res{width:100%;border-collapse:collapse;font-size:14px}.res td{padding:5px 6px;border-bottom:1px solid var(--line)}.res .num{text-align:right;font-variant-numeric:tabular-nums}
.mk-ok{color:var(--ok);font-weight:700}.mk-bad{color:var(--bad);font-weight:700}.mk-n{color:var(--muted)}
.pl-board ol{padding-left:20px;margin:8px 0}.pl-board li{display:flex;gap:10px}.pl-board li span{flex:1}
.cert{border:3px double var(--accent);border-radius:12px;padding:6px;background:var(--panel)}
.cert-in{text-align:center;padding:18px;display:flex;flex-direction:column;gap:6px;align-items:center}.cert-in h2{font-size:30px}.cert-score{font:700 22px var(--font-d);color:var(--accent);margin:0}
.pl-dbg{border-top:1px solid var(--line);background:var(--panel);font-size:12px;padding:4px 10px}.pl-dbg summary{cursor:pointer;color:var(--muted)}.pl-dbg pre{margin:4px 0 0;white-space:pre-wrap;font:12px var(--font-m)}
.player-only #player-root{height:100%;max-width:640px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}

/* Modal */
.backdrop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.qr{margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:#fff;color:#111}
.qr-one{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:6px 0}.qr-one svg{width:240px;height:240px;background:#fff;border:1px solid var(--line)}
.qr-svg{width:100%;max-width:150px}.qr-svg svg{width:100%;height:auto;display:block}
.qr figcaption{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:13px}.qr code{font:600 14px var(--font-m)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);max-width:90vw;padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media print{
  body.print-cert *,body.print-qr *{visibility:hidden}
  body.print-cert .cert,body.print-cert .cert *{visibility:visible}
  body.print-cert .cert{position:fixed;inset:0;margin:auto;height:fit-content}
  body.print-qr .print-area,body.print-qr .print-area *{visibility:visible}
  body.print-qr .print-area{position:absolute;left:0;top:0;width:100%}
  .no-print{display:none!important}
}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .mtabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;padding:10px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--muted);cursor:pointer}
  .mtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .app[data-panel="list"] .work,.app[data-panel="list"] .prev,.app[data-panel="edit"] .side,.app[data-panel="edit"] .prev,.app[data-panel="prev"] .side,.app[data-panel="prev"] .work{display:none}
  .side{border-right:0}.prev{border-left:0}.phone{max-height:none}
  .tools{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="app" data-panel="edit">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M16 4v6M16 22v6M4 16h6M22 16h6"/></svg>Bound Werkstatt</div>
    <input id="bound-title" type="text" aria-label="Titel des Bounds" placeholder="Titel des Bounds">
    <div class="tools">
      <button class="btn sm" id="b-undo" type="button" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
      <button class="btn sm" id="b-redo" type="button" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
      <button class="btn sm" id="b-new" type="button">Neu</button>
      <button class="btn sm" id="b-sample" type="button">Beispiel</button>
      <button class="btn sm" id="b-open" type="button">Öffnen</button>
      <button class="btn sm primary" id="b-link" type="button" title="Link erzeugen, mit dem andere den Bound direkt spielen">Spiel-Link</button>
      <button class="btn sm" id="b-save" type="button" title="Als JSON-Datei speichern (Strg+S)">Speichern</button>
      <button class="btn sm" id="b-copy" type="button">JSON kopieren</button>
      <button class="btn sm" id="b-qr" type="button">QR-Codes</button>
      <button class="btn sm" id="b-export" type="button" title="Eine einzelne HTML-Datei, die nur den Player enthält">Player-Datei</button>

/* ---------- Mini-Markdown (sicher: erst escapen, dann ersetzen) ---------- */

  const flushL = () => { if (list.length) { out += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
  for (const ln of lines) {

/* ---------- Bedingungen & Aktionen ---------- */

class Game {

  }

  }
  resolveTarget(t, i) {

    return i + 1;
  }
  goIdx(i) {
    for (;;) {
      if (++this.steps > 5000) { this.finish('loop'); return; }
      const el = this.els[i];
      if (!el) { this.finish(); return; }
      if (!evalConds(el.cond, this.vars)) { i++; continue; }
      if (el.type === 'action') {
        applyActions(el.actions, this.vars);
        i = this.resolveTarget(el.next, i); if (i < 0) return; continue;
      }
      if (el.type === 'jump') {
        let t = null;
        for (const r of el.rules || []) if (r.var && cmp(this.vars[r.var] == null ? 0 : this.vars[r.var], r.op, r.value)) { t = r.target; break; }
        if (t == null) t = el.next;
        i = this.resolveTarget(t, i); if (i < 0) return; continue;
      }
      if (el.type === 'end') { this.endText = el.text || ''; this.cur = null; this.finish(); return; }
      this.cur = el; this.curIdx = i; this.enteredAt = Date.now(); return;
    }
  }
  /** res: {points, max, correct(bool|null), answer, next} */
  complete(res) {
    const el = this.cur; if (!el) return;
    res = res || {};
    const pts = Number(res.points) || 0, max = Number(res.max) || 0;
    this.vars.score += pts; this.maxPts += max;
    if (res.correct === true) this.vars.correct++; else if (res.correct === false) this.vars.wrong++;
    this.log.push({ id: el.id, title: el.title, type: el.type, sub: el.sub || el.kind || '', points: pts, max, correct: res.correct == null ? null : res.correct, answer: res.answer == null ? null : res.answer, t: Date.now() - this.startedAt, skipped: !!res.skipped });

    const i = this.resolveTarget(t, this.curIdx);
    if (i >= 0) this.goIdx(i);
  }

    if (this.finished) return;
    this.finished = true; this.finishReason = reason || ''; this.finishedAt = Date.now(); this.cur = null;
  }
  get duration() { return (this.finishedAt || Date.now()) - (this.startedAt || Date.now()); }
  results() {
    return {
      format: 'bound-werkstatt-result', bound: this.bound.meta.title, name: this.name, team: this.team,
      score: this.vars.score, maxScore: this.maxPts, durationSec: Math.round(this.duration / 1000),
      finishedAt: new Date(this.finishedAt || Date.now()).toISOString(), variables: Object.assign({}, this.vars), steps: this.log
    };
  }
  serialize() {
    return {
      vars: this.vars, maxPts: this.maxPts, name: this.name, team: this.team, startedAt: this.startedAt, finished: this.finished,
      curId: this.cur ? this.cur.id : null, steps: this.steps,
      log: this.log.map(l => Object.assign({}, l, { answer: typeof l.answer === 'string' && l.answer.length > 300 ? '[Datei]' : l.answer }))
    };
  }
  restore(s) {
    this.reset(); Object.assign(this, { vars: s.vars, maxPts: s.maxPts, name: s.name, team: s.team, startedAt: s.startedAt, log: s.log, steps: s.steps || 0 });

  }
}

    E('quiz', 'q-match', { title: 'Hauptstädte', sub: 'match', text: 'Ordne jede Stadt dem Land zu.', pairs: [{ l: 'Wien', r: 'Österreich' }, { l: 'Bern', r: 'Schweiz' }, { l: 'Berlin', r: 'Deutschland' }], points: 15 }),
    E('quiz', 'q-num', { title: 'Wie viele Beine hat eine Spinne?', sub: 'number', value: 8, tolerance: 0, points: 5, attempts: 1 }),
    E('survey', 's-1', { title: 'Wie hat es dir gefallen?', sub: 'rating', text: 'Gib uns bis zu fünf Sterne.', required: false }),
    E('jump', 'j-bonus', { title: 'Bonus ab 40 Punkten?', rules: [{ var: 'score', op: '>=', value: 40, target: 'a-bonus' }], next: 'fin' }),
    E('action', 'a-bonus', { title: 'Bonus gutschreiben', actions: [{ var: 'score', op: 'add', value: 10 }] }),
    E('info', 'i-bonus', { title: 'Bonus!', text: 'Du hattest mindestens 40 Punkte und bekommst **10 Extra-Punkte**.' }),
    E('end', 'fin', { title: 'Ende', text: 'Danke für deine Teilnahme. Bis zum nächsten Mal!' })
  ];
  return b;
}

/* Spiel-Link: index.html?play=examples/mein-bound.json lädt einen Bound aus demselben Ordner und zeigt nur den Player. */
async function playFromUrl(rel) {
  const root = $('#player-root'); $('#app').hidden = true; root.hidden = false; document.body.classList.add('player-only');
  root.replaceChildren(h('p', { class: 'pl-card', style: { padding: '24px' } }, 'Lade …'));
  try {
    const u = new URL(rel, location.href);
    if (u.origin !== location.origin) throw new Error('Nur Dateien von derselben Webseite sind erlaubt.');
    const r = await fetch(u.href); if (!r.ok) throw new Error('Datei nicht gefunden (' + r.status + ').');
    new Player(root, normalizeBound(await r.json()).bound, { preview: false });
  } catch (e) {
    root.replaceChildren(h('div', { class: 'pl-card', style: { padding: '24px' } }, h('h2', {}, 'Der Bound konnte nicht geladen werden'), h('p', { class: 'muted' }, String(e.message || e)), h('p', {}, h('a', { href: location.pathname }, 'Zum Editor'))));
  }
}

async function playFromHash(tok) {
  const root = $('#player-root'); $('#app').hidden = true; root.hidden = false; document.body.classList.add('player-only');
  try { new Player(root, normalizeBound(await unpackBound(tok)).bound, { preview: false }); }
  catch (e) { root.replaceChildren(h('div', { class: 'pl-card', style: { padding: '24px' } }, h('h2', {}, 'Der Link ist unvollständig'), h('p', { class: 'muted' }, 'Kopiere ihn noch einmal vollständig. Manche Chat-Apps schneiden sehr lange Links ab.'))); }
}

(function main() {
  const hm = location.hash.match(/^#spiel=(.+)$/);
  if (hm) { playFromHash(hm[1]); return; }
  const playParam = new URLSearchParams(location.search).get('play');
  if (playParam) { playFromUrl(playParam); return; }
  const emb = document.getElementById('embedded-' + 'bound');
  let embedded = null;
  try { const t = emb && emb.textContent.trim(); if (t && t !== 'null') embedded = JSON.parse(t); } catch (e) { }
  const editMode = !embedded || location.hash === '#edit';
  if (!editMode) {
    $('#app').hidden = true; const root = $('#player-root'); root.hidden = false;
    document.body.classList.add('player-only');
    new Player(root, normalizeBound(embedded).bound, { preview: false });
    return;
  }
  let initial = null;
  if (embedded) initial = normalizeBound(embedded).bound;
  else {
    const raw = store.get('bw:draft');
    if (raw) { try { initial = normalizeBound(JSON.parse(raw)).bound; } catch (e) { } }
  }
  if (!initial || !initial.elements.length) initial = normalizeBound(sampleBound()).bound;
  initEditor(initial);
})();
